name: Update profile cards

on:
  schedule:
    - cron: "0 */12 * * *"   # 12 saatte bir güncelle
  workflow_dispatch:          # elle çalıştırılabilsin
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: 24

      # İstatistik + dil kartları
      - run: npm install --no-save @fontsource/inter@5.3.0
      - run: node scripts/generate-cards.js
        env:
          # Private repoları da görebilmesi için kişisel token (PROFILE_TOKEN secret'ı)
          GITHUB_TOKEN: ${{ secrets.PROFILE_TOKEN }}
          USERNAME: ${{ github.repository_owner }}
          OUT_DIR: dist

      # Yılan animasyonu
      - uses: Platane/snk@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/github-contribution-grid-snake-dark.svg?palette=github-dark

      # Hepsini "output" branch'ine yayınla
      - uses: crazy-max/ghaction-github-pages@v5
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
